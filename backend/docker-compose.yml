# version: '3.8'

services:
  backend:
    build: .
    container_name: gsdp_backend
    volumes:
      - .:/app
      - /app/env
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 2005 --reload
    ports:
      - "2005:2005"
    labels:
      - "traefik.enable=true"

      # Router for gsdpapi domain
      - "traefik.http.routers.gsdpapi.rule=Host(`gsdpapi.boscosofttech.com`)"
      - "traefik.http.routers.gsdpapi.entrypoints=websecure"
      - "traefik.http.routers.gsdpapi.tls.certresolver=mytlschallenge"
      - "traefik.http.services.gsdpapi.loadbalancer.server.port=2005"

      # Optional: force HTTP → HTTPS redirection
      - "traefik.http.routers.gsdpapi-http.rule=Host(`gsdpapi.boscosofttech.com`)"
      - "traefik.http.routers.gsdpapi-http.entrypoints=web"
      - "traefik.http.routers.gsdpapi-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

    networks:
      - n8n-docker_web

  gsdp:
    build: ./gsdp
    container_name: gsdp_streamlit
    volumes:
      - ./gsdp:/app
    env_file:
      - ./gsdp/.env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      streamlit run app.py
      --server.port 8000
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    ports:
      - "8000:8000"

networks:
  n8n-docker_web:
    name: n8n-docker_web
    # Set to true on the server where Traefik/n8n already created this network.
    external: true
